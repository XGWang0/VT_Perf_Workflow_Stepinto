[PHYSIVAL_MACHINE]
# Test Disk UIDs (UUIDs/Identifiers)
phy_machine_test_disk_uid = 'scsi-364cd98f05d651d002712c2f029596c27'

[PHYSIVAL_MACHINE.phy_machine_net_pair]
client_end = 'ph047'
server_end = 'vh019'


[VIRTUAL_MACHINE.vir_machine_cfg.pv.basic]
memory = 8192
cpu = 8
br_name = 'br0'

[VIRTUAL_MACHINE.vir_machine_cfg.pv.install.previous_product]
kernel_param = 'YAST_SKIP_XML_VALIDATION=1 console=hvc0,115200'
qemu_commandline = ''
extra_parameter = ''
register_url = 'inst.register_url=http://all-{build_num}.scc-proxy.suse.asia/'

[VIRTUAL_MACHINE.vir_machine_cfg.pv.install.current_product]
kernel_param = 'YAST_SKIP_XML_VALIDATION=1 console=hvc0,115200'
qemu_commandline = ''
extra_parameter = ''
register_url = 'inst.register_url=http://all-{build_num}.scc-proxy.suse.asia/'

[[VIRTUAL_MACHINE.vir_machine_cfg.pv.devices.disks]]
disk_type = "qcow2"
use_existing_disk_file = false
disk_size = '60G'
disk_image_param = " -o extended_l2=on,cluster_size=2M "
disk_cache = 'directsync'
disk_qemu_cmd = ''
disk_extra_cmd = '--disk path={disk_file_abs_path},format={disk_type},cache={disk_cache}'

[[VIRTUAL_MACHINE.vir_machine_cfg.pv.devices.nets]]
net_bus = 'virtio'
net_br_name = 'nettest_br'
net_qemu_cmd = ''
net_extra_cmd = ''

