use_existing_disk_file = false
disk_size = '60G'
disk_cache = 'none'
disk_bus = 'virtio'
l2_cache_size = '8388608'
disk_qemu_cmd = '-device pcie-root-port,addr=09.0,id=pci.10 -drive file={disk_file_abs_path},format={disk_type},l2-cache-size={l2_cache_size},if=none,cache={disk_cache},id=drive-virtio-disk1 -device virtio-blk-pci,drive=drive-virtio-disk1,id=virtio-disk1,bus=pci.10'
disk_extra_cmd = ''

# Array of tables for nets
[[VIRTUAL_MACHINE.vir_machine_cfg.vm.devices.nets]]
