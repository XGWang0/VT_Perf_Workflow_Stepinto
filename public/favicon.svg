<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Pure White Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#ffffff" />
  
  <!-- Clean Black Outline Group (No Body Fill, Stroke-width: 6.5) -->
  <g fill="none" stroke="#222222" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Rounded Head Dome -->
    <path d="M 60,82 A 40,40 0 1,1 140,82" />
    
    <!-- Chubby Body & Neck -->
    <path d="M 60,82 C 48,110 48,150 52,170 H 148 C 152,150 152,110 140,82" />
    
    <!-- Flat Beaver-like Paddle Tail -->
    <path d="M 148,145 C 168,142 185,146 190,160 C 195,174 175,180 148,174" />
    <!-- Tail texture lines -->
    <path d="M 158,152 Q 175,158 182,163" />
    <path d="M 152,162 Q 168,168 174,172" />
    
    <!-- Left Webbed Flipper -->
    <path d="M 52,170 C 40,174 30,182 34,190 C 38,196 50,192 60,170" />
    
    <!-- Right Webbed Flipper -->
    <path d="M 148,170 C 160,174 170,182 166,190 C 162,196 150,192 140,170" />
    
    <!-- Wide Duck Bill (Snout) facing forward with wave curves -->
    <path d="M 65,110 C 65,126 135,126 135,110 C 135,100 122,96 115,96 C 110,96 108,90 100,90 C 92,90 90,96 85,96 C 78,96 65,100 65,110 Z" />
    
    <!-- Friendly Eyebrows -->
    <path d="M 72,65 C 75,62 81,62 84,65" />
    <path d="M 116,65 C 119,62 125,62 128,65" />
  </g>
  
  <!-- Eyes & Nostrils (Solid Black Fills, No Strokes) -->
  <g fill="#222222">
    <circle cx="78" cy="78" r="5" />
    <circle cx="122" cy="78" r="5" />
    <circle cx="93" cy="114" r="2" />
    <circle cx="107" cy="114" r="2" />
  </g>
</svg>
